<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd X Stream</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="app-body">

    <header class="app-header">
        <div class="header-left">
            <span id="infoBtn">ℹ</span>
            <span id="themeToggleBtn">🌙</span>
        </div>
        <div class="header-right">
            <span class="app-title">Kurd X Stream</span>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ابحث عن قناة..." dir="rtl">
    </div>

    <div style="padding: 0 20px; margin-bottom: 15px; text-align: right;">
        <button id="filterFavBtn" style="background: none; border: 1px solid var(--accent-blue); color: var(--text-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;">عرض المفضلة فقط ⭐</button>
    </div>

    <main class="main-content" id="dynamicRowsContainer"></main>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3>حول Kurd X Stream</h3>
            <p>منصة احترافية تتيح لك مشاهدة القنوات الكردية والعالمية بث مباشر بأعلى جودة وتصميم ذكي متوافق تماماً مع الهواتف الذكية.</p>
            <p style="font-size: 0.85rem; color: #888;">إصدار التطبيق v2.0 © 2026</p>
            <button class="close-modal" id="closeInfoBtn">إغلاق</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
