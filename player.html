<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd X Stream - Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* زر تفعيل ملء الشاشة الاحترافي */
        .fullscreen-btn {
            background-color: var(--accent-blue, #00a2ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 162, 255, 0.4);
            transition: transform 0.2s;
        }
        .fullscreen-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="player-body">

    <header class="player-header">
        <a href="browse.html" class="back-btn-player">✕</a>
        <h2 class="player-ch-title" id="playingChannelTitle">Loading...</h2>
        <div style="width:20px;"></div>
    </header>

    <div class="video-centered-container">
        <div class="video-wrapper-standalone" id="videoContainer">
            <video id="standaloneVideoPlayer" controls autoplay playsinline></video>
        </div>
    </div>

    <div style="text-align: center; width: 100%;">
        <button class="fullscreen-btn" id="goFullscreenBtn">📺 تكبير الشاشة بالكامل</button>
    </div>

    <div style="height: 20px;"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
const channelName = urlParams.get('name');
const channelStreamUrl = urlParams.get('url');

const video = document.getElementById('standaloneVideoPlayer');
const videoContainer = document.getElementById('videoContainer');
const fullscreenBtn = document.getElementById('goFullscreenBtn');

if (channelName && channelStreamUrl) {
    document.getElementById('playingChannelTitle').innerText = decodeURIComponent(channelName);
    const decodedUrl = decodeURIComponent(channelStreamUrl);

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(decodedUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = decodedUrl;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
} else {
    document.getElementById('playingChannelTitle').innerText = "خطأ في تشغيل القناة";
}

// 🔘 تحسين تدوير الشاشة وتكبيرها لمنع خروج البث والحواف السوداء
fullscreenBtn.addEventListener('click', () => {
    // 1. تفعيل وضع ملء الشاشة للحاوي أولاً
    if (videoContainer.requestFullscreen) {
        videoContainer.requestFullscreen();
    } else if (videoContainer.webkitRequestFullscreen) { 
        videoContainer.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) { 
        video.webkitEnterFullscreen();
    }

    // 2. تدوير الشاشة تلقائياً للوضع الأفقي
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch((err) => {
            console.log("التدوير التلقائي يحتاج تفعيل خاصية التدوير في الهاتف نفسه أولاً.");
        });
    }
});

// 🔥 الحل السحري: مراقبة تغير وضع الشاشة وضبط أبعاد الفيديو بدقة بالغة
document.addEventListener('fullscreenchange', handleFullscreenResize);
document.addEventListener('webkitfullscreenchange', handleFullscreenResize);

function handleFullscreenResize() {
    // التحقق هل المتصفح في وضع ملء الشاشة حالياً؟
    const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

    if (isFullscreen) {
        // عند التكبير: نلغي الحواف السوداء ونجعل الفيديو يملأ الشاشة تماماً بدون أي خروج خارجي
        video.style.setProperty('width', '100vw', 'important');
        video.style.setProperty('height', '100vh', 'important');
        video.style.setProperty('object-fit', 'cover', 'important'); 
        videoContainer.style.background = "#000";
    } else {
        // عند التصغير: يعود الوضع للأبعاد الطبيعية المتجاوبة داخل الصندوق المخصص له
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.object-fit = 'contain';
    }
}

    </script>
</body>
</html>
