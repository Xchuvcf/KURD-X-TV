<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero TV - Pro Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* تصميم هيكل المشغل الاحترافي */
        .player-body {
            background-color: #000000;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* حاوي الفيديو والتحكم */
        .video-centered-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }

        .video-wrapper-standalone {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #standaloneVideoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            transition: all 0.2s;
            z-index: 1; /* طبقة الفيديو بالخلف */
        }

        /* 👑 الحل السحري: جعل شريط التحكم يطفو فوق الفيديو دائماً */
        .player-controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 70%, rgba(0, 0, 0, 0) 100%);
            padding: 25px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
            box-sizing: border-box;
            z-index: 99999 !important; /* رفعه لأعلى طبقة ممكنة فوق التمدد والـ Fullscreen */
        }

        /* الهيدر العلوي يطفو أيضاً فوق الفيديو */
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
            color: #fff;
            z-index: 99999 !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .control-btn {
            background: rgba(29, 29, 32, 0.85); /* خلفية شفافة سينمائية */
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            backdrop-filter: blur(5px); /* تأثير ضبابي زجاجي */
        }
        .control-btn:active { transform: scale(0.95); }

        .ratio-badge {
            background: #00a2ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .back-btn-player { color: #fff; text-decoration: none; font-size: 1.5rem; }
        .player-ch-title { font-size: 1.2rem; font-weight: bold; margin: 0; }
    </style>
</head>
<body class="player-body">

    <header class="player-header">
        <a href="browse.html" class="back-btn-player">✕</a>
        <h2 class="player-ch-title" id="playingChannelTitle">Loading...</h2>
        <div style="width:30px;"></div> 
    </header>

    <div class="video-centered-container" id="videoContainer">
        <div class="video-wrapper-standalone">
            <video id="standaloneVideoPlayer" autoplay playsinline></video>
        </div>

        <div class="player-controls-panel">
            <button class="control-btn" id="muteToggleBtn">🔊 كتم</button>
            <button class="control-btn" id="skipBackBtn">⏪ -10ث</button>
            <button class="control-btn" id="aspectRatioBtn">
                <span>📺 الأبعاد:</span>
                <span class="ratio-badge" id="ratioStatus">كامل البث</span>
            </button>
            <button class="control-btn" id="goFullscreenBtn" style="background: var(--accent-blue, #00a2ff);">fullscreen 📱</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const channelName = urlParams.get('name');
        const channelStreamUrl = urlParams.get('url');

        const video = document.getElementById('standaloneVideoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const fullscreenBtn = document.getElementById('goFullscreenBtn');
        const aspectRatioBtn = document.getElementById('aspectRatioBtn');
        const ratioStatus = document.getElementById('ratioStatus');
        const muteToggleBtn = document.getElementById('muteToggleBtn');
        const skipBackBtn = document.getElementById('skipBackBtn');

        let currentRatioMode = 0; 

        if (channelName && channelStreamUrl) {
            document.getElementById('playingChannelTitle').innerText = decodeURIComponent(channelName);
            const decodedUrl = decodeURIComponent(channelStreamUrl);

            if (Hls.isSupported()) {
                const hls = new Hls({ maxMaxBufferLength: 10 });
                hls.loadSource(decodedUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {
                        video.muted = true;
                        muteToggleBtn.innerText = "🔇 تشغيل الصوت";
                        video.play();
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = decodedUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        // 🔘 1. زر التحكم بالأبعاد الطافي
        aspectRatioBtn.addEventListener('click', () => {
            currentRatioMode = (currentRatioMode + 1) % 3;
            
            if (currentRatioMode === 0) {
                video.style.objectFit = 'contain';
                video.style.width = '100%';
                video.style.height = '100%';
                ratioStatus.innerText = "كامل البث";
            } else if (currentRatioMode === 1) {
                video.style.objectFit = 'cover';
                video.style.width = '100%';
                video.style.height = '100%';
                ratioStatus.innerText = "زوم كامل";
            } else if (currentRatioMode === 2) {
                video.style.objectFit = 'fill';
                video.style.width = '100vw';
                video.style.height = '100vh';
                ratioStatus.innerText = "تمديد";
            }
        });

        // 🔊 2. زر كتم وتفعيل الصوت
        muteToggleBtn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                muteToggleBtn.innerText = "🔊 كتم";
            } else {
                video.muted = true;
                muteToggleBtn.innerText = "🔇 تشغيل الصوت";
            }
        });

        // ⏪ 3. زر إرجاع البث 10 ثوانٍ
        skipBackBtn.addEventListener('click', () => {
            video.currentTime = Math.max(0, video.currentTime - 10);
        });

        // 📱 4. زر ملء الشاشة الكامل
        fullscreenBtn.addEventListener('click', () => {
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen();
            } else if (videoContainer.webkitRequestFullscreen) { 
                videoContainer.webkitRequestFullscreen();
            } else if (video.webkitEnterFullscreen) { 
                video.webkitEnterFullscreen();
            }

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        });

        // تأمين ثبات العرض للـ Container بالكامل مع الأزرار
        const syncOrientationDimensions = () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFullscreen) {
                videoContainer.style.width = '100vw';
                videoContainer.style.height = '100vh';
            } else {
                videoContainer.style.width = '100%';
                videoContainer.style.height = '100%';
            }
        };

        document.addEventListener('fullscreenchange', syncOrientationDimensions);
        document.addEventListener('webkitfullscreenchange', syncOrientationDimensions);
    </script>
</body>
</html>
