<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd X Stream - Admin Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="admin-body">

    <div class="admin-container" id="loginBox">
        <h2>Admin Sign In</h2>
        <form id="adminLoginForm">
            <input type="email" id="adminEmail" placeholder="Owner Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login as Owner</button>
        </form>
        <a href="browse.html" class="back-btn">← Back to Main App</a>
    </div>

    <div class="admin-container" id="adminPanelBox" style="display: none; width: 600px;">
        <h2>Kurd X Stream - Control Panel</h2>
        <button id="adminLogoutBtn" style="background:#555; margin-bottom:20px;">Logout from Admin</button>
        
        <div class="admin-sections-wrapper" style="display: flex; gap: 20px;">
            
            <div style="flex: 1; background: #252525; padding: 15px; border-radius: 6px;">
                <h3>📁 Manage Categories</h3>
                <form id="addCategoryForm">
                    <input type="text" id="catName" placeholder="New Category Name (e.g. Movies)" required>
                    <button type="submit" style="background: #0078d4;">Add Category</button>
                </form>
                <div id="adminCategoriesList" class="admin-list"></div>
            </div>

            <div style="flex: 1; background: #252525; padding: 15px; border-radius: 6px;">
                <h3>📺 Add New Channel</h3>
                <form id="addChannelForm">
                    <input type="text" id="chName" placeholder="Channel Name" required>
                    <input type="url" id="chUrl" placeholder="Stream URL (.m3u8)" required>
                    <input type="url" id="chLogo" placeholder="Channel Poster/Image URL" required>
                    
                    <label style="font-size: 0.8rem; color: #aaa;">Select Category:</label>
                    <select id="chCategory" required>
                        </select>
                    
                    <button type="submit">Add Channel</button>
                </form>
            </div>

        </div>

        <h3 style="margin-top: 30px;">📋 Current Channels</h3>
        <div id="adminChannelsList" class="admin-list"></div>
        <a href="browse.html" class="back-btn">← Go to Stream</a>
    </div>

    <script src="admin.js"></script>
</body>
</html>
